server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  application:
    name: macrotrack-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:macrotrack_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://*.vercel.app}
  nutrition:
    min-calorie-floor-female: 1200
    min-calorie-floor-male: 1500
